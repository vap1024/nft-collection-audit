name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependency
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Regenerate scorecards
        run: python examples/run_demo.py
      - name: Check generated sample is current
        run: git diff --exit-code -- examples/output/scorecards.md
      - name: Audit repository files
        run: python tools/check_repository.py
